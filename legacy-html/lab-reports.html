<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ল্যাব টেস্ট রিপোর্ট - JavrVX Organic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/tw-config.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="lab" class="min-h-screen flex flex-col">
    <div id="site-header"></div>

    <section id="pageBanner" data-icon="fa-flask-vial" data-title="ল্যাব টেস্ট রিপোর্ট ও সার্টিফিকেট" data-crumb="ল্যাব রিপোর্ট" data-sub="আমরা কথায় নয়, কাজে বিশ্বাসী। প্রতিটি ব্যাচ সরকারি ল্যাবে পরীক্ষা করে তবেই বিক্রি করা হয়।"></section>

    <main class="flex-1 bg-cream pb-20">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

            <!-- Selector -->
            <div class="flex justify-center -mt-6 relative z-10 mb-10" data-reveal="up">
                <div id="certTabs" class="flex gap-1 p-1.5 bg-white rounded-full shadow-xl shadow-leaf-900/5 overflow-x-auto scrollbar-none max-w-full"></div>
            </div>

            <div id="certPanel" class="grid lg:grid-cols-5 gap-6 transition-all duration-300"></div>

            <!-- Process -->
            <div class="mt-20">
                <div class="text-center mb-12">
                    <p data-reveal="up" class="eyebrow bg-leaf-900/5 text-leaf-700">আমাদের প্রক্রিয়া</p>
                    <h2 class="split font-bold text-4xl sm:text-5xl text-leaf-950 mt-4">প্রতিটি ব্যাচ যেভাবে পরীক্ষা হয়</h2>
                </div>
                <div class="relative max-w-3xl mx-auto">
                    <div class="absolute left-6 sm:left-1/2 top-0 bottom-0 w-0.5 bg-leaf-900/10 -translate-x-1/2">
                        <div id="timelineFill" class="w-full bg-gradient-to-b from-lime-500 to-gold-500 origin-top" style="height:0%"></div>
                    </div>
                    <div id="timeline" class="space-y-10"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- Certificate modal -->
    <div id="certModal" class="modal fixed inset-0 z-[80] flex items-center justify-center p-4 bg-leaf-950/70 backdrop-blur-md hidden" onclick="if(event.target===this)closeModal('certModal')">
        <div class="bg-white rounded-5xl max-w-lg w-full p-8 shadow-2xl relative text-center" style="animation: logo-pop .5s cubic-bezier(.34,1.56,.64,1)">
            <button onclick="closeModal('certModal')" aria-label="বন্ধ করুন" class="absolute top-5 right-5 w-10 h-10 rounded-full bg-cream hover:bg-leaf-900 hover:text-lime-500 transition-colors"><i class="fa-solid fa-xmark"></i></button>
            <div class="relative w-20 h-20 mx-auto rounded-full bg-lime-500 text-leaf-950 flex items-center justify-center text-3xl ring-pulse"><i class="fa-solid fa-certificate"></i></div>
            <h3 id="certTitle" class="font-display font-bold text-2xl text-leaf-950 mt-5"></h3>
            <p class="text-sm text-leaf-900/60 mt-1">সরকারি সার্টিফাইড পরীক্ষাগার কর্তৃক ভেরিফাইড</p>
            <div class="mt-6 p-6 rounded-3xl border-2 border-dashed border-leaf-600/40 bg-leaf-50">
                <i class="fa-solid fa-stamp text-5xl text-leaf-600 animate-float"></i>
                <p class="font-brand font-extrabold text-leaf-900 mt-3 tracking-wider">BCSIR / BSTI VERIFIED</p>
                <p id="certReg" class="text-xs text-leaf-700 mt-1 font-brand"></p>
                <p id="certDate" class="text-xs text-leaf-900/50 mt-1"></p>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        let activeCert = 0;
        const certProducts = { honey: ['jv-2', 'jv-4', 'jv-10'], oil: ['jv-22', 'jv-24', 'jv-25'], spice: ['jv-27', 'jv-28', 'jv-33'] };

        function renderTabs() {
            certTabs.innerHTML = certsData.map((c, i) => `
                <button onclick="selectCert(${i})" class="flex items-center gap-2 px-5 py-3 rounded-full text-sm font-bold whitespace-nowrap transition-all duration-300 ${i === activeCert ? 'bg-leaf-900 text-lime-500 shadow-lg' : 'text-leaf-900/60 hover:text-leaf-900'}">
                    <i class="fa-solid ${c.icon}"></i>${c.title}</button>`).join('');
        }

        function renderCert() {
            const c = certsData[activeCert];
            certPanel.innerHTML = `
                <div class="lg:col-span-2 relative overflow-hidden rounded-5xl ${c.tone === 'gold' ? 'bg-gold-500 text-leaf-950' : 'mesh-bg grain text-white'} p-8 sm:p-10 flex flex-col justify-between min-h-[380px]" style="animation: logo-pop .6s cubic-bezier(.16,1,.3,1) both">
                    <i class="fa-solid ${c.icon} absolute -right-6 -bottom-6 text-[180px] opacity-10 animate-float-slow"></i>
                    <div class="relative">
                        <span class="eyebrow ${c.tone === 'gold' ? 'bg-leaf-950/10' : 'glass text-lime-500'}">${c.lab}</span>
                        <h2 class="font-bold text-3xl sm:text-4xl mt-5 leading-tight">${c.title}</h2>
                        <p class="mt-3 ${c.tone === 'gold' ? 'text-leaf-950/70' : 'text-white/70'}">${c.summary}</p>
                    </div>
                    <div class="relative mt-8 space-y-2 text-sm ${c.tone === 'gold' ? 'text-leaf-950/70' : 'text-white/60'}">
                        <p><i class="fa-solid fa-hashtag w-5"></i> রেজি: <b class="font-brand ${c.tone === 'gold' ? 'text-leaf-950' : 'text-white'}">${c.reg}</b></p>
                        <p><i class="fa-regular fa-calendar w-5"></i> পরীক্ষার তারিখ: <b class="${c.tone === 'gold' ? 'text-leaf-950' : 'text-white'}">${c.date}</b></p>
                        <button onclick="viewCertificate()" class="btn ${c.tone === 'gold' ? 'btn-dark' : 'btn-lime'} px-6 py-3 mt-4">সার্টিফিকেট দেখুন <i class="fa-solid fa-arrow-right btn-icon"></i></button>
                    </div>
                </div>

                <div class="lg:col-span-3 bg-white rounded-5xl p-6 sm:p-10 border border-leaf-900/5" style="animation: logo-pop .6s .1s cubic-bezier(.16,1,.3,1) both">
                    <h3 class="font-display font-bold text-2xl text-leaf-950">পরীক্ষার ফলাফল</h3>
                    <p class="text-sm text-leaf-900/50 mb-6">বার দেখাচ্ছে অনুমোদিত সীমার কত শতাংশ ব্যবহৃত — সবগুলোই সীমার মধ্যে</p>
                    <div class="space-y-5">
                        ${c.results.map(([name, value, limit, used], i) => {
                            const none = used === 0;
                            const pct = none ? 1.5 : used;
                            return `
                            <div>
                                <div class="flex items-center justify-between text-sm mb-2">
                                    <span class="font-bold text-leaf-950">${name}</span>
                                    <span class="flex items-center gap-2"><b class="${none ? 'text-leaf-600' : 'text-leaf-950'}">${value}</b><span class="text-xs text-leaf-900/40">সীমা ${limit}</span></span>
                                </div>
                                <div class="h-3 rounded-full bg-cream overflow-hidden">
                                    <div class="result-bar h-full rounded-full bg-gradient-to-r from-lime-500 to-leaf-500 transition-all duration-1000 ease-out" style="width:0%;transition-delay:${0.3 + i * 0.12}s" data-w="${pct}"></div>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="mt-8 pt-6 border-t border-leaf-900/5">
                        <p class="text-xs font-bold text-leaf-900/50 uppercase tracking-wider mb-3">এই রিপোর্টের আওতাভুক্ত পণ্য</p>
                        <div class="flex flex-wrap gap-2">
                            ${certProducts[c.key].map(id => { const p = findProduct(id); return `<a href="product.html?id=${id}" class="flex items-center gap-2 pl-1 pr-4 py-1 rounded-full bg-cream hover:bg-lime-500 transition-colors text-sm font-semibold text-leaf-950"><img src="${p.image}" class="w-8 h-8 rounded-full object-cover" alt="">${p.name}</a>`; }).join('')}
                        </div>
                    </div>
                </div>`;
            requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('.result-bar').forEach(b => b.style.width = b.dataset.w + '%')));
        }

        function selectCert(i) {
            if (i === activeCert) return;
            activeCert = i;
            renderTabs();
            renderCert();
        }

        function viewCertificate() {
            const c = certsData[activeCert];
            certTitle.textContent = c.title;
            certReg.textContent = 'Certificate Reg No: ' + c.reg;
            certDate.textContent = 'পরীক্ষার তারিখ: ' + c.date;
            openModal('certModal');
        }

        const steps = [
            ['fa-vials', 'নমুনা সংগ্রহ', 'প্রতিটি নতুন ব্যাচ থেকে এলোমেলোভাবে নমুনা নেওয়া হয়।'],
            ['fa-building-columns', 'সরকারি ল্যাবে প্রেরণ', 'BCSIR ও BSTI অনুমোদিত পরীক্ষাগারে পাঠানো হয়।'],
            ['fa-microscope', 'বিশ্লেষণ', 'ভেজাল, হেভি মেটাল, কীটনাশক ও আর্দ্রতা পরীক্ষা।'],
            ['fa-file-circle-check', 'রিপোর্ট প্রকাশ', 'পাস করলে তবেই পণ্য বিক্রির জন্য ছাড়া হয়, রিপোর্ট এখানে প্রকাশ।'],
        ];
        timeline.innerHTML = steps.map(([icon, t, d], i) => `
            <div class="relative flex items-center gap-6 sm:gap-0 ${i % 2 ? 'sm:flex-row-reverse' : ''}">
                <div class="hidden sm:block sm:w-1/2 ${i % 2 ? 'sm:pl-12' : 'sm:pr-12 sm:text-right'}" data-reveal="${i % 2 ? 'right' : 'left'}">
                    <h4 class="font-display font-bold text-xl text-leaf-950">${t}</h4>
                    <p class="text-sm text-leaf-900/60 mt-1">${d}</p>
                </div>
                <div data-reveal="zoom" class="relative z-10 w-12 h-12 shrink-0 rounded-full bg-leaf-900 text-lime-500 flex items-center justify-center shadow-lg sm:absolute sm:left-1/2 sm:-translate-x-1/2"><i class="fa-solid ${icon}"></i></div>
                <div class="sm:hidden" data-reveal="left">
                    <h4 class="font-display font-bold text-xl text-leaf-950">${t}</h4>
                    <p class="text-sm text-leaf-900/60 mt-1">${d}</p>
                </div>
                <div class="hidden sm:block sm:w-1/2"></div>
            </div>`).join('');

        // Timeline fills as you scroll
        addEventListener('scroll', () => {
            const r = timeline.getBoundingClientRect();
            const p = Math.min(1, Math.max(0, (innerHeight * 0.7 - r.top) / r.height));
            timelineFill.style.height = p * 100 + '%';
        }, { passive: true });

        renderTabs();
        renderCert();
    </script>
</body>
</html>
